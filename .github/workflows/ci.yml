name: CI

# The only gate: a fixed upstream release (terraria-server-1449) repackaged for
# Docker. This builds the image exactly the way the README says to and asserts
# the server binary, its config file, and the world mount still land where the
# compose file expects them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow calls the whole file as its gate: all jobs below
  # must pass before anything ships.
  workflow_call:

# Static, finite, no cache reuse between runs at this cadence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: terraria:smoke

      # The binary name and path are what an upstream repackaging could silently
      # rename; fail if the file the ENTRYPOINT points at is missing.
      - name: Assert the server binary exists
        run: |
          docker run --rm --entrypoint sh terraria:smoke -c '
            test -x /home/terraria/server/TerrariaServer.bin.x86_64
          '

  # Security scans. They need Docker images and registry egress, so they only run
  # on GitHub-hosted runners. None of them is a required check — the gate stays
  # `Build and inspect`. No OSV job: this repo has no package manifest.
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the whole history: a leaked secret lives in it
      - name: Run Gitleaks
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/path" ghcr.io/gitleaks/gitleaks:latest detect --source=/path --verbose

  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@9770db26039f6566a5dbd0626c0de613ab75a5f9 # v1
    permissions:
      contents: read
    with:
      scans: actionlint semgrep trivy
