name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (just check)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: terraria:smoke

      # The binary name and path are what an upstream repackaging could silently
      # rename; fail if the file the ENTRYPOINT points at is missing.
      - name: Assert the server binary exists
        run: |
          docker run --rm --entrypoint sh terraria:smoke -c '
            test -x /home/terraria/server/TerrariaServer.bin.x86_64
          '

  # No OSV job: this repo has no package manifest.
  scan:
    name: Scan
    uses: Delnegend/actions/.github/workflows/scan.yml@95dff8c808d26b0b4b849450d90652b9b4aca685 # v1
    permissions:
      contents: read
