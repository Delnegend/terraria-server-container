name: Release / Build Artifacts

# One image, one version, decided by the commit history rather than by anyone
# typing a number.
#
# `semver-action` reads the Conventional Commits since the latest tag and
# returns the next version. Nothing here - no flag, no input, no hand-rolled
# arithmetic - can override it, so the version is a fact about the commits and
# not a claim someone made about them.
#
#   feat:  -> minor      fix/refactor/build: -> patch
#   everything else                 -> no bump, so nothing is released
#

# Solo-dev maintenance flow: one run, zero clicks on the happy path.
# Sunday cron (or a manual run) gates on all of CI, then bumps, tags,
# pushes, builds, and ships. No PR, no second run, no PAT.
#
# Branch protection keeps force-push/deletion/linear-history guards but
# requires no status checks, so the bot pushes the bump straight to main.
# The gate below is stronger than the old PR flow: it needs all of CI green,
# where the PR only required the build.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Empty = ship a new version. SHA = test-build it (no publish). Tag = rebuild it."
        required: false
        type: string
      dry-run:
        description: "Preview only: print each action (gate, bump, tag, build, publish) without doing any of it."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # Weekly: Sunday 00:00 UTC

# Serialise releases: two concurrent runs must never race for the same version.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  # A literal, lowercase, with no expressions. `${{ github.repository }}`
  # expands to `Delnegend/...`, and buildx rejects a mixed-case image
  # reference before it builds anything:
  #   invalid tag "ghcr.io/Delnegend/terraria-server-container:1.0.0":
  #   repository name must be lowercase
  IMAGE: ghcr.io/delnegend/terraria-server-container

jobs:
  # Every CI job must pass before anything ships.
  gate:
    name: Gate (all of CI)
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Prepare (bump, tag, push)
    needs: gate
    # Orchestration plus `just check`, so the full runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # `semver-action` compares against `fallbackTag`; if that tag does not
      # exist yet, its compare call 404s. Anchor the first release at HEAD
      # instead of requiring a hand-made tag. A dry run never mutates: on a
      # fresh repo it stops with a clear message instead of a stack trace.
      - name: Anchor the first release tag
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ -n "$(git tag -l 'v[0-9]*')" ]; then
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::error::no release tags yet — a real run anchors v0.0.0 at HEAD before calculating; there is nothing a dry run could release."
            exit 1
          fi
          echo "no release tag yet — anchoring v0.0.0 at HEAD"
          git -c user.name="github-actions[bot]" \
              -c user.email="actions@users.noreply.github.com" \
              tag -a v0.0.0 -m "Anchor tag for the first release calculation"
          git push origin "refs/tags/v0.0.0"

      - name: Calculate Next SemVer
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1
        with:
          token: ${{ github.token }}
          # No tag exists yet; anchoring arithmetic starts here. Must name a
          # real tag shape or the action errors on an empty history.
          fallbackTag: v0.0.0
          # Nothing to release is a normal outcome, not a failure.
          noNewCommitBehavior: silent
          noVersionBumpBehavior: patch

      - name: Bump, tag, and push
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry-run }}
          GATE_SHA: ${{ github.sha }}
          BUMP: ${{ steps.semver.outputs.bump }}
          CURRENT: ${{ steps.semver.outputs.current }}
          NEXT: ${{ steps.semver.outputs.next }}
          NEXT_STRICT: ${{ steps.semver.outputs.nextStrict }}
        run: |
          set -euo pipefail
          # TOCTOU guard: the gate ran on GATE_SHA. If main moved since,
          # the checkout below is ungated code — refuse to ship it.
          # (Ref paths pin their own commit, so they skip this check.)
          if [ -z "$INPUT_REF" ]; then
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$HEAD_SHA" != "$GATE_SHA" ]; then
              echo "::error::main moved during the gate ($GATE_SHA -> $HEAD_SHA); re-run to gate the new HEAD."
              exit 1
            fi
          fi
          # Dispatch guide: empty = ship, SHA = test, tag = rebuild.
          # Dry-run first: a preview must never mutate, on any path.
          if [ "$DRY_RUN" = "true" ]; then
            if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{7,64}$'; then
              echo "[dry-run] would test-build commit $INPUT_REF (no publish)"
            elif [ -z "$INPUT_REF" ]; then
              echo "[dry-run] would bump to $NEXT_STRICT, tag $NEXT, push, build, and publish"
            elif echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "[dry-run] would rebuild tag $INPUT_REF and publish it"
            else
              echo "::error::ref must be empty, a commit SHA (7-64 hex), or a version tag (vX.Y.Z); got '$INPUT_REF'."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # SHA test-build: full hashes only (short SHAs misroute or collide).
          if echo "$INPUT_REF" | grep -qE '^[0-9a-f]{7,64}$'; then
            echo "Test build against commit $INPUT_REF (will not publish)."
            { echo "ref=$INPUT_REF"; echo "version=$INPUT_REF"; echo "publish=false"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tag rebuild: strict format, must already exist.
          if [ -n "$INPUT_REF" ]; then
            echo "$INPUT_REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::ref must be a commit SHA or a version tag (vX.Y.Z); got '$INPUT_REF'."; exit 1; }
            git rev-parse -q --verify "refs/tags/$INPUT_REF" >/dev/null || { echo "::error::tag $INPUT_REF does not exist."; exit 1; }
            echo "Rebuilding existing tag $INPUT_REF."
            { echo "ref=$INPUT_REF"; echo "version=${INPUT_REF#v}"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Recovery before the BUMP=none exit: a previous run may have pushed
          # the bump commit but died before tagging. semver sees only the
          # non-conventional chore(release) commit and reports none — but the
          # manifest is ahead of the latest tag, so there IS work to do.
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          MANIFEST_VER="$(cat VERSION)"
          if [ -n "$LATEST_TAG" ] && [ "v$MANIFEST_VER" != "$LATEST_TAG" ] && [ "$(printf '%s\n%s\n' "v$MANIFEST_VER" "$LATEST_TAG" | sort -V | head -n1)" = "$LATEST_TAG" ]; then
            echo "Manifest ($MANIFEST_VER) is ahead of latest tag ($LATEST_TAG); tagging the stranded commit."
            git config user.name "github-actions[bot]"
            git config user.email "actions@users.noreply.github.com"
            TAG="v$MANIFEST_VER"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            { echo "ref=$TAG"; echo "version=$MANIFEST_VER"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing releasable since the last tag: clean exit, no noise.
          # semver-action returns before setOutput('bump') when there are no
          # new commits at all, so NEXT is the reliable signal, not BUMP.
          # Guarding on BUMP alone leaves NEXT empty, which either trips the
          # re-ship guard or ships an empty ref.
          if [ -z "$NEXT" ] || [ "$BUMP" = "none" ]; then
            echo "No version bump needed (current: ${CURRENT:-none})."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuse to re-ship: NEXT must sort after the latest tag.
          if [ -n "$LATEST_TAG" ]; then
            if [ "$NEXT" = "$LATEST_TAG" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$LATEST_TAG" | sort -V | head -n1)" = "$NEXT" ]; then
              echo "::error::Calculated $NEXT is not ahead of latest tag $LATEST_TAG; nothing new to ship."
              exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          just bump "$NEXT_STRICT"
          git add -u
          git diff --staged --quiet && { echo "::error::bump produced no change in package files"; exit 1; }
          git commit -m "chore(release): ${NEXT}"
          # Push the commit first: if the tag push fails, the next run
          # recovers via the manifest-ahead check above.
          git push origin HEAD:main
          git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null && { echo "::error::tag ${NEXT} already exists"; exit 1; }
          git tag -a "${NEXT}" -m "Release ${NEXT}"
          git push origin "refs/tags/${NEXT}"
          { echo "ref=$NEXT"; echo "version=$NEXT_STRICT"; echo "publish=true"; echo "skip=false"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build & Release Artifacts
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    # A container image build, so it needs the full runner's toolchain.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release
      packages: write   # to push to ghcr.io
    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The compose file joins the external `web-tailscale` network and
      # bind-mounts `serverconfig.txt` plus `./data`, so neither can travel to
      # CI: the network may not exist on the runner, and the config is
      # gitignored by design. Build the Dockerfile directly for byte-identical
      # layers, and copy the example config aside so the layer context matches.
      - name: Stage the example config for the build context
        run: |
          set -euo pipefail
          cp serverconfig.txt.example serverconfig.txt
          echo "staged serverconfig.txt from the example for the build context"

      # One published image, with exactly two tags: the exact version and
      # `latest`. No rolling major.minor or major tags, so `:1.0.3` always
      # means the same thing and there is nothing ambiguous to accidentally
      # deploy.
      - name: Build and push server
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          load: ${{ needs.prepare.outputs.publish != 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$DIGEST" > image-digest.txt
          echo "built image digest: $DIGEST"

      - name: Upload digest artifact (always kept in the Actions run)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digest-${{ needs.prepare.outputs.ref }}
          path: image-digest.txt
          if-no-files-found: error

      # The tag already exists by the time this runs: `prepare` created and
      # pushed it before the build started. That is the point - the release
      # names a version that is already a fact about the repository - but it
      # also means a build failure here leaves a tag with no release. The
      # repair is to re-run with `ref` set to the tag, which rebuilds it and
      # publishes its release without touching the version.
      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.ref }}
          generate_release_notes: true
          body: |
            Container image:

            ```
            podman pull ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ```

            Or `latest` for the most recent release. The git tag `${{ needs.prepare.outputs.ref }}`
            is the same image, named the way git wants it.
